# Imperative equivalents (for reference):
#   kubectl create secret generic db-creds --from-literal=username=admin --from-literal=password='S3cr3t!'
#   kubectl create secret tls web-tls --cert=tls.crt --key=tls.key
#   kubectl create secret docker-registry regcred --docker-server=ghcr.io --docker-username=me --docker-password=$GH_TOKEN
#
# NOTE: values below are base64-encoded, NOT encrypted. `echo -n 'admin' | base64` == YWRtaW4=
# Anyone with `get` on this object (or etcd/backup access, if encryption-at-rest isn't configured) reads it in plaintext.

apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: production
type: Opaque              # generic key-value secret — the default, catch-all type
data:
  username: YWRtaW4=      # base64("admin")
  password: UzNjcjN0IQ==  # base64("S3cr3t!")

---
# TLS secret — consumed directly by Ingress spec.tls, no extra plumbing needed.
apiVersion: v1
kind: Secret
metadata:
  name: web-tls
  namespace: production
type: kubernetes.io/tls   # keys MUST be exactly tls.crt and tls.key
data:
  tls.crt: LS0tLS1CRUdJTi... # base64-encoded PEM certificate (full chain)
  tls.key: LS0tLS1CRUdJTi... # base64-encoded PEM private key

---
# Image pull secret — required when pulling from a private registry (ECR, GHCR, private Docker Hub repo).
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: production
type: kubernetes.io/dockerconfigjson   # single key: .dockerconfigjson holding registry auth
data:
  .dockerconfigjson: eyJhdXRocyI6eyJnaGNyLmlvIjp7InVzZXJuYW1lIjoibWUiLCJwYXNzd29yZCI6InRva2VuIn19fQ==

---
# Immutable secret — same rationale as immutable ConfigMap: no watch overhead, no accidental edits.
apiVersion: v1
kind: Secret
metadata:
  name: db-creds-e5f6a7b8
  namespace: production
type: Opaque
immutable: true
data:
  username: YWRtaW4=
  password: UzNjcjN0IQ==

---
# Pod consuming Secrets: env var (single key), envFrom (bulk), volume mount, and imagePullSecrets.
apiVersion: v1
kind: Pod
metadata:
  name: db-client-demo
  namespace: production
spec:
  imagePullSecrets:
    - name: regcred                # dockerconfigjson secret used by kubelet to pull the image
  containers:
    - name: app
      image: ghcr.io/acme/db-client:2.1.0
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password         # captured ONCE at container start — no live update without pod restart
      envFrom:
        - secretRef:
            name: db-creds          # every key becomes an env var
      volumeMounts:
        - name: creds-volume
          mountPath: /etc/secrets   # each key -> a file, mode 0400 by default; DOES receive periodic sync updates
          readOnly: true
  volumes:
    - name: creds-volume
      secret:
        secretName: db-creds
        defaultMode: 0400
